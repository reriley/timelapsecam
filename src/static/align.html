<!DOCTYPE html>
<html lang="en">
<head>
<title>Align Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
<link href="/static/styles.css" rel="stylesheet">
<style>
	html, body {
		background-color: black;
		color: grey;
	}
	a, span, a:visited {
		color: grey;
	}
</style>
<script>
    function updateOpacity(value) {
        var slider = document.getElementById("opacity");
        fetch(
        	"/align_adjust",
        	{
	        	method: 'POST',
	       	    headers: {
	       	      'Accept': 'application/json',
	       	      'Content-Type': 'application/json'
	       	    },
	       	    body: JSON.stringify({"opacity": value})
       	  	});
    	}
</script>
</head>
<body>
	{% include "nav.html" %}
    <center>
    	<img src="/align_stream"/>
    </center>
    <center>
	    <input type="range" id="opacity" min="0" max="100" step="10" value="50" oninput="updateOpacity(this.value)"/>
	    <button onclick="document.getElementById('popup').style.display='block'; return false;">
	      Capture Reference
	    </button>
	    
	    <!-- Popup -->
    </center>
    <div id="popup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4);">
	    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
	                background:#fff; padding:1.5rem; border-radius:6px; box-shadow:0 2px 8px #0003;">
	      <p>Type <b>CONFIRM</b> to confirm:</p>
	      <input id="popupInput" placeholder="CONFIRM" value="">
	      <div style="margin-top:1rem; text-align:right;">
	        <button onclick="
	           if(document.getElementById('popupInput').value.trim()==='CONFIRM'){
	             fetch('/align_capture',{method:'POST',body:'confirmed'});
	             document.getElementById('popup').style.display='none';
	           }else{
	             alert('Wrong text – keeping old reference.');
	           }">OK</button>
	        <button onclick="document.getElementById('popup').style.display='none'">Cancel</button>
	      </div>
	    </div>
	  </div>
</body>
</html>
